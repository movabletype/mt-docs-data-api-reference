name: movabletype/mt-docs-data-api-reference
on:
  push:
    branches:
    - "**/*"
  pull_request:
  schedule:
  - cron: 0 8 * * *
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
    - uses: actions/setup-node@v7.1.0
      with:
        cache: npm
        node-version: '20'
    - run: npm install
    - run: npm run redoc
